name: Problem report
description: Report VP guidance that is incorrect, unsafe, unclear, or ineffective
title: "[Problem]: "
body:
  - type: markdown
    attributes:
      value: Thank you for helping make VP more verifiable. Remove secrets and private data from all evidence.
  - type: input
    id: revision
    attributes:
      label: VP revision
      description: Commit or release used when the problem occurred.
    validations:
      required: true
  - type: input
    id: host
    attributes:
      label: AI host and model
      description: Include versions and relevant configuration where known.
    validations:
      required: false
  - type: textarea
    id: goal
    attributes:
      label: Intended outcome
      description: What were you trying to achieve?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Provide the prompt, visible context, selected VP material, and sequence of actions.
    validations:
      required: true
  - type: textarea
    id: observed
    attributes:
      label: Observed behaviour and evidence
      description: What happened? Include all relevant runs, including failures and inconsistent outcomes.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
      description: What checkable result did you expect?
    validations:
      required: true
  - type: textarea
    id: impact
    attributes:
      label: Impact
      description: What decision, output, or safety boundary was affected?
    validations:
      required: true
