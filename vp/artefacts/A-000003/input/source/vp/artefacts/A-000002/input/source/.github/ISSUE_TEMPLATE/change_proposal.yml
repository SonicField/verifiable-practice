name: Change proposal
description: Propose an improvement grounded in an observed need
title: "[Proposal]: "
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What limitation or failure have you observed?
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: How can another person reproduce or inspect the problem?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: What should change, and where does it belong?
    validations:
      required: true
  - type: textarea
    id: falsifier
    attributes:
      label: Falsification criterion
      description: What observable result would show that this proposal does not help?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: What other responses did you consider, including making no change?
    validations:
      required: false
